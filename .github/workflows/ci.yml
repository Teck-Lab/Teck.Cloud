name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NX_DAEMON: false

jobs:
  scope:
    name: Resolve affected baseline
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ github.sha }}
      fast: ${{ steps.job-outputs.outputs.fast }}
      coverage: ${{ steps.job-outputs.outputs.coverage }}
      aspire: ${{ steps.job-outputs.outputs.aspire }}
      kubernetes: ${{ steps.job-outputs.outputs.kubernetes }}
      images: ${{ steps.job-outputs.outputs.images }}
      coverage_components: ${{ steps.job-outputs.outputs.coverage_components }}
      coverage_full: ${{ steps.job-outputs.outputs.coverage_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Prepare a full-repository fallback
        id: baseline
        run: echo "empty-tree=$(git hash-object -w -t tree --stdin < /dev/null)" >> "$GITHUB_OUTPUT"
      - name: Resolve affected baseline
        id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: main
          workflow-id: ci.yml
          fallback-sha: ${{ steps.baseline.outputs.empty-tree }}
      - name: Create authoritative CI scope manifest
        env:
          CI_EVENT: ${{ github.event_name }}
          NX_BASE: ${{ steps.shas.outputs.base }}
          NX_HEAD: ${{ github.sha }}
          CI_SCOPE_BASELINE_SOURCE: nx-set-shas
        run: node tools/ci-scope.mjs
      - name: Export manifest job selection
        id: job-outputs
        run: |
          manifest=.artifacts/ci-scope.json
          for job in fast coverage aspire kubernetes images; do
            required="$(jq -r ".jobs.${job}.required" "$manifest")"
            echo "${job}=$required" >> "$GITHUB_OUTPUT"
          done
          jq -c '.jobs.kubernetes.expectedMatrix' "$manifest" | sed 's/^/kubernetes_matrix=/' >> "$GITHUB_OUTPUT"
          jq -r '.coverageFull' "$manifest" | sed 's/^/coverage_full=/' >> "$GITHUB_OUTPUT"
          jq -c '.coverageComponents' "$manifest" | sed 's/^/coverage_components=/' >> "$GITHUB_OUTPUT"
      - name: Upload authoritative CI scope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci-scope.json
          if-no-files-found: error
          retention-days: 7

  fast:
    name: Build and fast checks
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_BASE: ${{ needs.scope.outputs.base }}
      NX_HEAD: ${{ needs.scope.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts
      - name: Validate run-bound scope before setup
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bun tools/ci-scope.mjs --validate .artifacts/ci-scope.json --head "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Restore .NET projects
        run: dotnet restore Teck.Cloud.slnx --locked-mode
      - name: Materialize the first-run empty-tree baseline
        run: git hash-object -w -t tree --stdin < /dev/null
      - name: Workspace configuration and formatting
        run: bun run check
      - name: Verify .NET analyzer policy and package compatibility
        run: bun run verify:dotnet-policy
      - name: Verify project references are synchronized
        run: bun run sync:check
      - name: Enforce the service project layout
        run: bun run verify:service-layout
      - name: Verify tooling behavior
        run: bun run test:tooling
      - name: Run manifest-selected fast targets
        run: |
          for target in build lint typecheck test test:integration; do
            projects="$(jq -r --arg target "$target" '.targets[$target] // [] | join(",")' .artifacts/ci-scope.json)"
            [ -z "$projects" ] || bun run nx run-many -t "$target" --projects="$projects" --parallel=1
          done
      - name: Install browser for selected static verification projects
        run: |
          projects="$(jq -r '.targets["verify:static"] // [] | join(",")' .artifacts/ci-scope.json)"
          if [ -n "$projects" ]; then
            dotnet build tests/integration/SharedKernel.Infrastructure.IntegrationTests/SharedKernel.Infrastructure.IntegrationTests.csproj -c Release --no-restore
            pwsh tests/integration/SharedKernel.Infrastructure.IntegrationTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          fi
      - name: Verify selected static Wolverine handlers
        run: |
          projects="$(jq -r '.targets["verify:static"] // [] | join(",")' .artifacts/ci-scope.json)"
          [ -z "$projects" ] || bun run nx run-many -t verify:static --projects="$projects" --parallel=1
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-fast-${{ github.sha }}
          path: |
            .artifacts/
            **/TestResults/
            **/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Full unit and integration coverage
    needs: scope
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.coverage == 'true'
    timeout-minutes: 30
    env:
      NX_BASE: ${{ needs.scope.outputs.base }}
      NX_HEAD: ${{ needs.scope.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts
      - name: Validate run-bound scope before setup
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bun tools/ci-scope.mjs --validate .artifacts/ci-scope.json --head "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Run coverage only when full or components were selected
        id: coverage-selection
        env:
          FULL: ${{ needs.scope.outputs.coverage_full }}
          COMPONENTS: ${{ needs.scope.outputs.coverage_components }}
        run: |
          if [ "$FULL" = true ]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif [ "$COMPONENTS" = '[]' ]; then
            echo 'mode=none' >> "$GITHUB_OUTPUT"
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=components' >> "$GITHUB_OUTPUT"
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.coverage-selection.outputs.run == 'true'
        with:
          global-json-file: global.json
      - name: Install pinned workspace dependencies
        if: steps.coverage-selection.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Restore .NET projects
        if: steps.coverage-selection.outputs.run == 'true'
        run: dotnet restore Teck.Cloud.slnx --locked-mode
      - name: Materialize the first-run empty-tree baseline
        if: steps.coverage-selection.outputs.run == 'true'
        run: git hash-object -w -t tree --stdin < /dev/null
      - name: Build the identity image used by integration tests
        if: steps.coverage-selection.outputs.run == 'true'
        run: bun run nx run keycloak-theme:container:build
      - name: Install browser for real Keycloak integration tests
        if: steps.coverage-selection.outputs.run == 'true'
        run: |
          dotnet build tests/integration/SharedKernel.Infrastructure.IntegrationTests/SharedKernel.Infrastructure.IntegrationTests.csproj -c Release
          pwsh tests/integration/SharedKernel.Infrastructure.IntegrationTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Enforce selected unit and integration coverage components
        env:
          CI_COVERAGE_MODE: ${{ steps.coverage-selection.outputs.mode }}
          CI_COVERAGE_COMPONENTS: ${{ needs.scope.outputs.coverage_components }}
        run: |
          case "$CI_COVERAGE_MODE" in
            full) bun run coverage -- --full ;;
            components) bun run coverage -- --components "$CI_COVERAGE_COMPONENTS" ;;
            none) bun run coverage -- --components '[]' ;;
            *) echo "Invalid coverage mode: $CI_COVERAGE_MODE" >&2; exit 1 ;;
          esac
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-coverage-${{ github.sha }}
          path: |
            .artifacts/
            **/TestResults/
            **/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  aspire:
    name: Application E2E
    needs: scope
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.aspire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NX_BASE: ${{ needs.scope.outputs.base }}
      NX_HEAD: ${{ needs.scope.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts
      - name: Validate run-bound scope before setup
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bun tools/ci-scope.mjs --validate .artifacts/ci-scope.json --head "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Restore .NET projects
        run: dotnet restore Teck.Cloud.slnx --locked-mode
      - name: Materialize the first-run empty-tree baseline
        run: git hash-object -w -t tree --stdin < /dev/null
      - name: Build identity image for selected E2E projects
        run: |
          projects="$(jq -r '.targets["test:e2e"] // [] | join(",")' .artifacts/ci-scope.json)"
          case ",$projects," in *,Identity.E2ETests,*) bun run nx run keycloak-theme:container:build ;; esac
      - name: Install browser for selected identity E2E
        run: |
          projects="$(jq -r '.targets["test:e2e"] // [] | join(",")' .artifacts/ci-scope.json)"
          case ",$projects," in
            *,Identity.E2ETests,*)
              dotnet build tests/e2e/web/Identity.E2ETests/Identity.E2ETests.csproj -c Release --no-restore
              pwsh tests/e2e/web/Identity.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
              ;;
          esac
      - name: Run manifest-selected application E2E
        run: |
          projects="$(jq -r '.targets["test:e2e"] // [] | join(",")' .artifacts/ci-scope.json)"
          if [ -n "$projects" ]; then
            TECK_REDIS_ADVERTISED_HOST="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
            export TECK_REDIS_ADVERTISED_HOST
            bun run nx run-many -t test:e2e --projects="$projects" --parallel=1
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-aspire-${{ github.sha }}
          path: |
            .artifacts/
            **/TestResults/
            **/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  kubernetes:
    name: Kubernetes E2E (${{ matrix.mode }})
    needs: scope
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.scope.outputs.kubernetes_matrix) }}
    env:
      NX_BASE: ${{ needs.scope.outputs.base }}
      NX_HEAD: ${{ needs.scope.outputs.head }}
      TECK_KIND_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts
      - name: Validate run-bound scope before setup
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bun tools/ci-scope.mjs --validate .artifacts/ci-scope.json --head "$GITHUB_SHA"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Restore .NET projects
        run: dotnet restore Teck.Cloud.slnx --locked-mode
      - name: Materialize the first-run empty-tree baseline
        run: git hash-object -w -t tree --stdin < /dev/null
      - name: Install pinned KIND, kubectl and Helm
        run: |
          curl --fail --silent --show-error --location https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          curl --fail --silent --show-error --location https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum -o "$RUNNER_TEMP/kind.sha256sum"
          (cd "$RUNNER_TEMP" && sed 's/kind-linux-amd64/kind/' kind.sha256sum | sha256sum --check)
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/kubectl"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl.sha256 -o "$RUNNER_TEMP/kubectl.sha256"
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind" "$RUNNER_TEMP/kubectl"
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tar.gz"
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz.sha256sum -o "$RUNNER_TEMP/helm.sha256sum"
          (cd "$RUNNER_TEMP" && sed 's/helm-v4.1.4-linux-amd64.tar.gz/helm.tar.gz/' helm.sha256sum | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          mv "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/helm"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build images for selected Kubernetes projects
        run: |
          projects="$(jq -r '.targets["test:kubernetes"] // [] | join(",")' .artifacts/ci-scope.json)"
          if [ -n "$projects" ]; then
            bun run nx run keycloak-theme:container:build
            bun run nx run Identity.TestHost:container:build
            bun run nx run Identity.ClusterProbe:container:build
          fi
      - name: Run manifest-selected Kubernetes E2E
        run: |
          projects="$(jq -r '.targets["test:kubernetes"] // [] | join(",")' .artifacts/ci-scope.json)"
          [ -z "$projects" ] || bun run nx run-many -t test:kubernetes --projects="$projects" --parallel=1
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-kubernetes-${{ matrix.mode }}-${{ github.sha }}
          path: |
            .artifacts/
            **/TestResults/
            **/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Affected container builds
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_BASE: ${{ needs.scope.outputs.base }}
      NX_HEAD: ${{ needs.scope.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts
      - name: Validate run-bound scope before setup
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bun tools/ci-scope.mjs --validate .artifacts/ci-scope.json --head "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Restore .NET projects
        run: dotnet restore Teck.Cloud.slnx --locked-mode
      - name: Build manifest-selected deployable images
        run: |
          projects="$(jq -r '.targets["container:build"] // [] | join(",")' .artifacts/ci-scope.json)"
          [ -z "$projects" ] || bun run nx run-many -t container:build --projects="$projects" --parallel=1
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-images-${{ github.sha }}
          path: |
            .artifacts/
            **/TestResults/
            **/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  check:
    name: Affected checks
    if: always()
    needs: [scope, fast, coverage, aspire, kubernetes, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Require every validation lane
        env:
          RESULTS: ${{ toJSON(needs) }}
          CI_SCOPE_PATH: .artifacts/ci-scope.json
          CI_SCOPE_EXPECTED_HEAD: ${{ github.sha }}
        run: node tools/check-ci-results.mjs

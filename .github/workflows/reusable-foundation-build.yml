name: Reusable foundation build
on:
  workflow_call:
# No caller-provided commands, artifact digests, source refs or inherited secrets.
permissions: {}
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful checks for this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          for workflow in ci.yml security.yml; do
            result=$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SOURCE_SHA&branch=main&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')
            if [ "$result" != success ]; then
              echo "Required workflow $workflow has not succeeded for this commit."
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore the locked dependency graph
        run: dotnet restore Teck.Cloud.slnx --locked-mode
      - name: Build the actual foundation packages
        env:
          SOURCE_SHA: ${{ github.sha }}
          CANDIDATE_VERSION: 0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages" "$RUNNER_TEMP/candidate"
          for project in SharedKernel.Core SharedKernel.Persistence SharedKernel.Infrastructure; do
            dotnet pack "src/shared/$project/$project.csproj" -c Release --no-restore \
              -p:PackageVersion="$CANDIDATE_VERSION" -p:RepositoryCommit="$SOURCE_SHA" \
              -p:ContinuousIntegrationBuild=true -p:UseSharedCompilation=false \
              --output "$RUNNER_TEMP/packages"
          done
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/packages/source-commit.txt"
          tar -czf "$RUNNER_TEMP/candidate/teck-cloud-foundation.tar.gz" -C "$RUNNER_TEMP/packages" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/teck-cloud-foundation.tar.gz
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      # Deliberately no source checkout or execution of downloaded build output.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foundation-build-${{ github.run_attempt }}
          path: candidate
      - name: Attest the bytes produced by this workflow run
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: candidate/teck-cloud-foundation.tar.gz
      - name: Package the verification bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" candidate/provenance.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-attested-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 90

  verify:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foundation-attested-${{ github.run_attempt }}
          path: candidate
      - name: Verify provenance and reject tampering
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          policy=(--repo "$REPOSITORY" --signer-workflow "$REPOSITORY/.github/workflows/reusable-foundation-build.yml" --signer-digest "$SOURCE_SHA" --source-digest "$SOURCE_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --bundle candidate/provenance.sigstore.json)
          gh attestation verify candidate/teck-cloud-foundation.tar.gz "${policy[@]}" --format json > candidate/verification.json
          cp candidate/teck-cloud-foundation.tar.gz "$RUNNER_TEMP/tampered.tar.gz"
          printf 'tampered\n' >> "$RUNNER_TEMP/tampered.tar.gz"
          if gh attestation verify "$RUNNER_TEMP/tampered.tar.gz" "${policy[@]}"; then
            echo 'ERROR: verifier accepted changed artifact bytes'
            exit 1
          fi
          if gh attestation verify candidate/teck-cloud-foundation.tar.gz "${policy[@]}" --source-digest 0000000000000000000000000000000000000000; then
            echo 'ERROR: verifier accepted an incorrect source commit'
            exit 1
          fi
          if gh attestation verify candidate/teck-cloud-foundation.tar.gz "${policy[@]}" --signer-workflow "$REPOSITORY/.github/workflows/untrusted.yml"; then
            echo 'ERROR: verifier accepted an incorrect builder identity'
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-verified-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 90

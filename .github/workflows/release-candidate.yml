name: Release candidate
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Only successful main push check runs are accepted. This workflow never checks out or executes their artifacts; it reads exact-SHA checks before using trusted default-branch action config.
    workflows: [CI, Security and quality]
    types: [completed]
permissions: {}
concurrency:
  group: github-releases-main
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Require all checks for the exact source commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for workflow in ci.yml security.yml; do
            conclusion=$(gh api --method GET "repos/$REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$SOURCE_SHA" -f branch=main -f per_page=20 \
              --jq '[.workflow_runs[] | select(.event == "push")][0].conclusion // "pending"')
            if [ "$conclusion" != success ]; then
              echo "$workflow has not passed for $SOURCE_SHA: $conclusion"
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          main_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" != "$SOURCE_SHA" ]; then
            echo "Main advanced past $SOURCE_SHA; the newer commit will receive the RC."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing=$(gh api --method GET "repos/$REPOSITORY/releases" -f per_page=100 --paginate --slurp \
            | jq --arg sha "$SOURCE_SHA" '[.[][] | select(.prerelease and (.draft | not) and .target_commitish == $sha)] | length')
          if [ "$existing" -gt 0 ]; then
            echo "RC already published for $SOURCE_SHA"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Update the stable draft
        if: steps.gate.outputs.publish == 'true'
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: release-drafter.yml
          prerelease: false
          commitish: ${{ github.event.workflow_run.head_sha }}
      - name: Publish the RC
        if: steps.gate.outputs.publish == 'true'
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: release-drafter.yml
          prerelease-identifier: rc
          publish: true
          commitish: ${{ github.event.workflow_run.head_sha }}

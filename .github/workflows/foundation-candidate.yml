name: Foundation candidate
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: foundation-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/reusable-foundation-build.yml # zizmor: ignore[self-repository] -- Actionlint 1.7.12 lacks $/ support; this job-level call resolves at the caller commit, never from runtime files.

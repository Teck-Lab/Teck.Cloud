apiVersion: v1
kind: Namespace
metadata:
  name: identity-unmeshed
---
apiVersion: batch/v1
kind: Job
metadata:
  name: plaintext-rejected
  namespace: identity-unmeshed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          image: curlimages/curl:8.17.0
          command: [sh, -ec]
          args:
            - |
              if curl --silent --fail --max-time 10 http://keycloak.identity.svc.cluster.local:8080/realms/teck-local/.well-known/openid-configuration; then
                echo 'Unauthenticated plaintext bypass unexpectedly succeeded' >&2
                exit 1
              fi
              echo teck-plaintext-rejected
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

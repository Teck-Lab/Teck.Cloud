apiVersion: batch/v1
kind: Job
metadata:
  name: platform-probe
  namespace: platform-proof
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: tls
          image: curlimages/curl:8.17.0
          command: [sh, -ec]
          args:
            - "curl --fail --retry 20 --retry-all-errors --retry-delay 2 --cacert /certs/ca.crt https://gateway.platform-proof.svc.cluster.local/ | grep teck-gateway-ready"
          volumeMounts:
            - name: certificate
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: redis
          image: quay.io/opstree/redis:v8.10.1
          command: [sh, -ec]
          args:
            - |
              attempt=0
              while [ "$attempt" -lt 30 ]; do
                set -- $(redis-cli --raw -h redis-sentinel -p 26379 SENTINEL get-master-addr-by-name myMaster)
                if [ "$#" = 2 ] && [ "$1" != 0.0.0.0 ]; then
                  if [ "$(redis-cli --raw -h "$1" -p "$2" SET teck-proof sentinel-discovered)" = OK ] &&
                     [ "$(redis-cli --raw -h "$1" -p "$2" GET teck-proof)" = sentinel-discovered ]; then
                    echo teck-sentinel-ready
                    exit 0
                  fi
                fi
                attempt=$((attempt + 1))
                sleep 2
              done
              echo "Sentinel did not provide a writable primary within 60 seconds" >&2
              exit 1
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: certificate
          secret:
            secretName: gateway-tls
            items:
              - key: ca.crt
                path: ca.crt

apiVersion: v1
kind: Namespace
metadata:
  name: teck-smoke
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-smoke
  namespace: teck-smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          image: busybox:1.37.0
          command:
            [
              sh,
              -c,
              "nslookup kubernetes.default.svc.cluster.local && echo teck-kind-ready && sleep 30",
            ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi

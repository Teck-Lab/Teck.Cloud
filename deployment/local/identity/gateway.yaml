apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: identity
spec:
  secretName: identity-tls
  dnsNames: [localhost]
  issuerRef:
    name: teck-local-ca
    kind: ClusterIssuer
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: identity-nodeport
spec:
  kube:
    service:
      type: NodePort
      ports:
        - port: 18443
          nodePort: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: identity
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: identity-nodeport
  listeners:
    - name: https
      hostname: localhost
      protocol: HTTPS
      port: 18443
      tls:
        mode: Terminate
        certificateRefs:
          - name: identity-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity
spec:
  parentRefs:
    - name: identity
  hostnames: [localhost]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 8080

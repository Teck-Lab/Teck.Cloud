openapi: 3.1.0
info:
  title: Commerce admin gateway API
  version: 1.0.0
  description: >-
    Normative v1 JSON contract for the staff commerce gateway. Every operation
    targets exactly one tenant named in the route and requires its own staff
    permission. The gateway and Orders both enforce the permission. This
    contract exposes no provisioning, deletion, payment override or readiness
    override operation; fulfillment readiness is derived from internal
    verification of recorded placement evidence.
servers:
  - url: https://api.teck.cloud
security:
  - bearerAuth: []
tags:
  - name: Admin orders
paths:
  /v1/admin/commerce/tenants/{tenantId}/orders:
    get:
      operationId: listAdminCommerceOrders
      tags: [Admin orders]
      summary: List one tenant's orders with a bounded per-tenant query
      description: >-
        Staff select a tenant; there is no unrestricted global query. Results are
        bounded newest-first pages ordered by `updatedAt` descending, then
        `orderId` ascending as a deterministic tie-breaker. Cursors are opaque.
        Default limit is 25, maximum 100.
      x-required-permission: CommerceOrdersRead
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A bounded page of the selected tenant's orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderPage"
              examples:
                orders:
                  $ref: "#/components/examples/AdminOrdersPage"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/commerce/tenants/{tenantId}/orders/{orderId}:
    get:
      operationId: getAdminCommerceOrder
      tags: [Admin orders]
      summary: Read one order's customer metadata plus staff facts and audit
      description: >-
        Adds payment, approval, fulfillment and audit facts. Omits the license
        document, provider references and secret identifiers.
      x-required-permission: CommerceOrdersRead
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Admin order facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
              examples:
                approved:
                  $ref: "#/components/examples/AdminOrderApproved"
                ready:
                  $ref: "#/components/examples/AdminOrderReady"
                sharedReady:
                  $ref: "#/components/examples/AdminOrderSharedReady"
                approvalPending:
                  $ref: "#/components/examples/AdminOrderApprovalPending"
                failed:
                  $ref: "#/components/examples/AdminOrderFailed"
                grantPending:
                  $ref: "#/components/examples/AdminOrderGrantPending"
                probeRetrying:
                  $ref: "#/components/examples/AdminOrderProbeRetrying"
                rejected:
                  $ref: "#/components/examples/AdminOrderRejected"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/commerce/tenants/{tenantId}/orders/{orderId}/decision:
    post:
      operationId: decideAdminCommerceOrder
      tags: [Admin orders]
      summary: Record the final approve or reject decision
      description: >-
        Requires a trimmed nonblank `reason` of at most 512 characters and a
        matching `expectedRevision`. The first decision is final: with a matching
        revision `pending → approved` or `pending → rejected`; any later decision
        attempt is `409 invalid_transition`. The actor comes from the
        authenticated staff principal and is recorded with the server UTC time
        and order ID.
      x-required-permission: CommerceOrdersDecide
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
            examples:
              approve:
                $ref: "#/components/examples/ApproveDecision"
              reject:
                $ref: "#/components/examples/RejectDecision"
      responses:
        "200":
          description: The updated admin order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
              examples:
                approved:
                  $ref: "#/components/examples/AdminOrderApproved"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/commerce/tenants/{tenantId}/orders/{orderId}/placement-evidence:
    post:
      operationId: recordAdminPlacementEvidence
      tags: [Admin orders]
      summary: Record manual placement evidence for internal verification
      description: >-
        Records a bounded nonsecret evidence reference for the order's tenant and
        tier. It is not proof and is never fetched. Verification is asynchronous
        and internal; this operation never returns a staff- or browser-supplied
        `ready` flag. Evidence can be recorded or re-recorded only while the
        order is approved and currently paid. Newest evidence gets a fresh
        revision even for the same placement; a result for an older revision
        never overwrites it.
      x-required-permission: CommercePlacementRecord
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementEvidenceRequest"
            examples:
              dedicatedPrimary:
                $ref: "#/components/examples/RecordPlacementEvidence"
      responses:
        "200":
          description: The updated admin order; verification outcome is asynchronous
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
              examples:
                verifying:
                  $ref: "#/components/examples/AdminOrderVerifying"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TenantId"
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
  schemas:
    TenantId:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: Immutable Keycloak organization UUID.
    Revision:
      type: integer
      minimum: 1
      maximum: 4294967295
      description: Bounded uint32 order, decision or evidence revision.
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Positive amount in minor units, bounded by the JavaScript safe-integer limit.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 uppercase currency code.
      additionalProperties: false
    Tier:
      type: string
      enum: [shared, dedicated]
    OrderStatus:
      type: string
      enum: [pendingPayment, pendingApproval, pendingReadiness, active, rejected, failed]
      description: >-
        `pendingReadiness` covers missing, stale or retrying placement proof and
        fresh proof without a matching current grant. `active` requires paid and
        approved state, fresh current proof and the matching current grant.
        `failed` follows terminal binding or capability failure; probe_unavailable
        remains retryable and nonterminal.
    AddOnCode:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$"
    Payment:
      type: object
      required: [status, paidThrough]
      properties:
        status:
          type: string
          enum: [pending, paid]
        paidThrough:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      additionalProperties: false
    Approval:
      type: object
      required: [status, actorId, reason, occurredAt]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        actorId:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
            - type: "null"
        reason:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 512
            - type: "null"
        occurredAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      additionalProperties: false
    Fulfillment:
      type: object
      required: [status, placementId, evidenceReference, observedAt, failureCode]
      properties:
        status:
          type: string
          enum: [awaitingEvidence, verifying, ready, failed]
          description: >-
            `verifying` with `probe_unavailable` is retryable and nonterminal.
            `failed` is terminal only for binding mismatch or missing required
            capability. A `ready` proof is current only while its evidence revision
            is fresh at the order's `updatedAt`.
        placementId:
          oneOf:
            - type: string
              format: uuid
              pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            - type: "null"
        evidenceReference:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 512
            - type: "null"
        observedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        failureCode:
          oneOf:
            - type: string
              enum: [binding_mismatch, capability_unavailable, probe_unavailable]
            - type: "null"
      additionalProperties: false
    AuditEntry:
      type: object
      required: [orderId, actorId, action, reason, occurredAt]
      properties:
        orderId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        actorId:
          type: string
          minLength: 1
          maxLength: 128
        action:
          type: string
          enum: [approve, reject, recordPlacementEvidence]
        reason:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 512
            - type: "null"
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false
    AdminOrder:
      type: object
      required:
        - orderId
        - subscriptionId
        - tier
        - addOnCodes
        - total
        - status
        - revision
        - createdAt
        - updatedAt
        - payment
        - approval
        - fulfillment
        - audit
      properties:
        orderId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        subscriptionId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        tier:
          $ref: "#/components/schemas/Tier"
        addOnCodes:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AddOnCode"
        total:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/OrderStatus"
        revision:
          $ref: "#/components/schemas/Revision"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        payment:
          $ref: "#/components/schemas/Payment"
        approval:
          $ref: "#/components/schemas/Approval"
        fulfillment:
          $ref: "#/components/schemas/Fulfillment"
        audit:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/AuditEntry"
      additionalProperties: true
    AdminOrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminOrder"
        nextCursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 512
            - type: "null"
      additionalProperties: true
    DecisionRequest:
      type: object
      required: [decision, reason, expectedRevision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "\\S"
          description: Trimmed nonblank staff reason; the server stores the trimmed value.
        expectedRevision:
          $ref: "#/components/schemas/Revision"
      additionalProperties: false
    PlacementEvidenceRequest:
      type: object
      required: [placementId, evidenceReference, expectedRevision]
      properties:
        placementId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "\\S"
          description: >-
            Bounded nonsecret audit reference. It is not proof and is never
            fetched.
        expectedRevision:
          $ref: "#/components/schemas/Revision"
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        status:
          type: integer
          enum: [400, 401, 403, 404, 409, 422, 503]
        code:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - forbidden
            - not_found
            - idempotency_conflict
            - stale_revision
            - invalid_transition
            - unsupported_option
            - dependency_unavailable
        detail:
          type: string
          maxLength: 1024
        instance:
          type: string
          maxLength: 512
      additionalProperties: true
  responses:
    ValidationProblem:
      description: Invalid input (400 invalid_request)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidRequest:
              $ref: "#/components/examples/InvalidRequestProblem"
    Unauthenticated:
      description: Missing or invalid credentials (401 unauthenticated)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unauthenticated:
              $ref: "#/components/examples/UnauthenticatedProblem"
    Forbidden:
      description: Authenticated staff principal without the route permission (403 forbidden)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              $ref: "#/components/examples/ForbiddenProblem"
    NotFound:
      description: Absent or out-of-scope resource (404 not_found)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notFound:
              $ref: "#/components/examples/NotFoundProblem"
    Conflict:
      description: Stale revision or final state conflict (409 stale_revision or invalid_transition)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            staleRevision:
              $ref: "#/components/examples/StaleRevisionProblem"
            invalidTransition:
              $ref: "#/components/examples/InvalidTransitionProblem"
    Unavailable:
      description: Transient dependency failure (503 dependency_unavailable)
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unavailable:
              $ref: "#/components/examples/UnavailableProblem"
